# TACTUS slurm configuration.
# Fill from `bash slurm/cluster_probe.sh`. Every field here is read by slurm/submit.py.
# Leave a value empty to omit that #SBATCH line entirely.

# --- accounting (from `sacctmgr show assoc user=$USER`) ---
ACCOUNT=
QOS=
MAIL_USER=
MAIL_TYPE=

# --- paths ---
DATA_ROOT=/projects/EEG-foundation-model
REPO_ROOT=/home/infres/yinwang/TACTUS/tactus
# Everything TACTUS derives (trial table, epoch memmaps, video embeddings, runs):
WORK_ROOT=/projects/EEG-foundation-model/tactus_work
LOG_ROOT=/projects/EEG-foundation-model/tactus_work/logs

# --- how to enter the python environment inside a job ---
# Whatever the server already uses. Examples:
#   ENV_SETUP="module load cuda/12.4 && source /opt/conda/etc/profile.d/conda.sh && conda activate eegfm"
ENV_SETUP="source /home/infres/yinwang/anaconda3/etc/profile.d/conda.sh && conda activate tactus"

# --- partition policy -------------------------------------------------------
# Rationale (see slurm/README.md): the TACTUS EEG encoders are 0.1-4M params on
# (64 x 120) inputs — a batch of 256 is ~8 MB. They are dataloader-bound, not
# compute-bound. Queueing for H100 wastes wall-clock waiting. Reserve the big
# cards for the genuinely large rows: EEG foundation-model fine-tuning and
# billion-parameter video encoders.
CPU_PARTITION=CPU,cpu-high
CPU_HIGH_PARTITION=cpu-high,CPU
# ordered preference; submit.py picks the first that is visible and least contended.
#
# V100, P100, A30 and 3090 are deliberately excluded: they are slow enough that the
# queue wait they save is not worth the wall-clock they cost. Measured placement
# before the change: a 40-fold grid landed on P100/V100 and ran ~52 min per fold.
# Dropping 3090 also removes the 4-CPU-per-GPU cap that slurm applied to the whole
# multi-partition request (it validates against the strictest member), so
# cpus-per-task is no longer pinned at 4 -- A100 nodes carry 64 cores for 3 GPUs.
#
# Both lists are capped at MaxTime=1-00:00:00 by these partitions; keep --time
# under 24 h or the job is rejected rather than queued.
GPU_SMALL_PARTITIONS=A100,L40S,H100
GPU_LARGE_PARTITIONS=H100,A100,L40S

# --- per-stage resources ----------------------------------------------------
# download: network-bound, 80-way array over subjects
DOWNLOAD_TIME=04:00:00
DOWNLOAD_CPUS=4
DOWNLOAD_MEM=8G
DOWNLOAD_ARRAY_THROTTLE=8        # concurrent s3 syncs; raise if the FS keeps up

# trials: single short CPU job
TRIALS_TIME=00:30:00
TRIALS_CPUS=4
TRIALS_MEM=32G

# preprocess: 1 task per subject; reads a 1.3 GB BDF at 2048 Hz + ICA -> memory hungry
PREPROCESS_TIME=08:00:00
PREPROCESS_CPUS=8
PREPROCESS_MEM=64G
PREPROCESS_ARRAY_THROTTLE=10

# embed: one small GPU, minutes for SigLIP2-base; raise for InternVideo2-1B / V-JEPA2 ViT-g
EMBED_TIME=02:00:00
EMBED_CPUS=4
EMBED_MEM=48G
EMBED_GPUS=1

# baseline linear MVPA: CPU array over subjects
MVPA_TIME=04:00:00
MVPA_CPUS=8
MVPA_MEM=48G
MVPA_ARRAY_THROTTLE=16

# train: GPU array over folds (40 folds for the double-disjoint cell)
TRAIN_TIME=04:00:00
TRAIN_CPUS=4
TRAIN_MEM=64G
TRAIN_GPUS=1
TRAIN_ARRAY_THROTTLE=6           # be a good cluster citizen; raise when the queue is empty

# foundation-model fine-tuning (LaBraM/CBraMod/EEGPT) — the only rows that need a big card
FM_TIME=12:00:00
FM_CPUS=12
FM_MEM=96G
FM_GPUS=1

# eval/aggregation: CPU
EVAL_TIME=04:00:00
EVAL_CPUS=16
EVAL_MEM=96G

# requeue on preemption/timeout (all TACTUS stages are idempotent + resumable)
REQUEUE=1
